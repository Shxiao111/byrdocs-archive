name: BUMP fork sync

on:
  workflow_dispatch:
    inputs:
      version:
        description: '正式版本号；留空时从 RSS 获取'
        type: string
      retry:
        description: '重新处理已关闭或已合并的版本'
        type: boolean
        default: false
      storage_action:
        description: '测试存储：sync 日常同步；probe 连接检查；exercise 故障演练；publish 发布已合并版本'
        type: choice
        options: [sync, probe, exercise, publish]
        default: sync
  schedule:
    - cron: '35 19 * * *'
  push:
    paths:
      - 'scripts/bump/**'
      - '.github/workflows/**'
      - 'sources/bump.json'
      - 'metadata/**'
  pull_request:
    paths:
      - 'scripts/bump/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'Shxiao111/byrdocs-archive'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/bump/requirements.txt
      - run: python -m pip install -r scripts/bump/requirements.txt
      - run: python -m unittest discover -s scripts/bump -p 'test_*.py' -v

  sync:
    needs: test
    if: >-
      github.repository == 'Shxiao111/byrdocs-archive' &&
      vars.BUMP_TEST_STORAGE_ENABLED != 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.BUMP_SCHEDULE_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: bump-fork-sync
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      SYNC_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/bump/requirements.txt
      - run: python -m pip install -r scripts/bump/requirements.txt
      - name: Discover formal release
        id: discover
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RETRY_VERSION: ${{ inputs.retry }}
        run: |
          args=()
          if [ -n "$REQUESTED_VERSION" ]; then args+=(--version "$REQUESTED_VERSION"); fi
          if [ "$RETRY_VERSION" = true ]; then args+=(--retry); fi
          python scripts/bump/sync.py discover --repository "$SYNC_REPOSITORY" "${args[@]}"
      - name: Split and validate offline
        if: steps.discover.outputs.build == 'true'
        env:
          BUMP_VERSION: ${{ steps.discover.outputs.version }}
        run: python scripts/bump/sync.py build --version "$BUMP_VERSION" --output output/bump --apply
      - name: Upload test files
        if: steps.discover.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bump-${{ steps.discover.outputs.version }}-fork-test
          path: |
            output/bump/files/
            output/bump/metadata/
            output/bump/manifest.json
            output/bump/cleanup-preview.json
          if-no-files-found: error
          retention-days: 14
      - name: Create PR in this fork
        if: steps.discover.outputs.build == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/bump/sync.py pr --repository "$SYNC_REPOSITORY" --output output/bump --run-url "$RUN_URL"

  storage:
    needs: test
    if: >-
      github.repository == 'Shxiao111/byrdocs-archive' &&
      vars.BUMP_TEST_STORAGE_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.BUMP_SCHEDULE_ENABLED == 'true') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master'))
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/bump-storage.yml
    with:
      action: ${{ github.event_name == 'push' && 'publish' || inputs.storage_action || 'sync' }}
      version: ${{ inputs.version || '' }}
      retry: ${{ inputs.retry == true }}
    secrets: inherit
