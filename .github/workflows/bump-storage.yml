name: BUMP private test storage

on:
  workflow_call:
    inputs:
      action:
        type: string
        required: true
      version:
        type: string
        required: true
      retry:
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  storage:
    if: github.repository == 'Shxiao111/byrdocs-archive' && vars.BUMP_TEST_STORAGE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: bump-fork-sync
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUMP_TEST_STORAGE_ENABLED: ${{ vars.BUMP_TEST_STORAGE_ENABLED }}
      BUMP_SCHEDULE_ENABLED: ${{ vars.BUMP_SCHEDULE_ENABLED }}
      BUMP_TEST_ACCOUNT_ID: ${{ vars.BUMP_TEST_ACCOUNT_ID }}
      BUMP_TEST_FILES_BUCKET: ${{ vars.BUMP_TEST_FILES_BUCKET }}
      BUMP_TEST_DATA_BUCKET: ${{ vars.BUMP_TEST_DATA_BUCKET }}
      BUMP_TEST_BACKUP_BUCKET: ${{ vars.BUMP_TEST_BACKUP_BUCKET }}
      BUMP_TEST_BACKUP_ENDPOINT: ${{ vars.BUMP_TEST_BACKUP_ENDPOINT }}
      BUMP_TEST_BACKUP_REGION: ${{ vars.BUMP_TEST_BACKUP_REGION }}
      BUMP_TEST_ACCESS_KEY_ID: ${{ secrets.BUMP_TEST_ACCESS_KEY_ID }}
      BUMP_TEST_SECRET_ACCESS_KEY: ${{ secrets.BUMP_TEST_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Manual pre-merge tests use the explicitly selected implementation branch.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Restrict manual sync and refresh merged data
        env:
          ACTION: ${{ inputs.action }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$ACTION" = sync ] && [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo 'sync must run from the default branch'; exit 1
          fi
          git fetch origin "$DEFAULT_BRANCH"
          if [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            git checkout --detach "origin/$DEFAULT_BRANCH"
          else
            git restore --source="origin/$DEFAULT_BRANCH" -- metadata sources/bump.json
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/bump/requirements.txt
      - run: python -m pip install -r scripts/bump/requirements.txt
      - name: Run storage action
        id: run
        env:
          ACTION: ${{ inputs.action }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RETRY_VERSION: ${{ inputs.retry }}
        run: |
          args=()
          if [ -n "$REQUESTED_VERSION" ]; then args+=(--version "$REQUESTED_VERSION"); fi
          if [ "$RETRY_VERSION" = true ]; then args+=(--retry); fi
          python scripts/bump/pipeline.py "$ACTION" --output output/bump/storage "${args[@]}"
      - name: Upload verified test artifacts
        if: always() && inputs.action != 'probe'
        uses: actions/upload-artifact@v4
        with:
          name: bump-private-storage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/bump/storage/ordinary/files/
            output/bump/storage/ordinary/metadata/
            output/bump/storage/release/files/
            output/bump/storage/release/metadata/
            output/bump/storage/release/manifest.json
            output/bump/storage/candidate/files/
            output/bump/storage/candidate/metadata/
            output/bump/storage/candidate/manifest.json
            output/bump/storage/candidate/cleanup-preview.json
            output/bump/storage/exercise-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Create data PR in the fork
        if: steps.run.outputs.create_pr == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/bump/sync.py pr --repository "$GITHUB_REPOSITORY" --output output/bump/storage/candidate --run-url "$RUN_URL"
